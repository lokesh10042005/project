version: "3.9"

# ── AI Privacy Shield — Full Stack ────────────────────────────────────────
#
# Services:
#   api        — FastAPI backend (port 8000)
#   worker     — Celery async worker
#   beat       — Celery periodic task scheduler
#   flower     — Celery monitoring UI (port 5555)
#   postgres   — PostgreSQL 16 (port 5432)
#   mongo      — MongoDB 7 (port 27017)
#   redis      — Redis 7 (port 6379)
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f api

services:

  # ── FastAPI API Server ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: aps_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aps_user:${POSTGRES_PASSWORD}@postgres:5432/ai_privacy_shield
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - uploads_vol:/app/uploads
      - outputs_vol:/app/outputs
      - logs_vol:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [aps_net]

  # ── Celery Worker ────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: aps_worker
    restart: unless-stopped
    command: >
      celery -A app.worker worker
      --loglevel=info
      --concurrency=2
      --queues=processing,maintenance
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aps_user:${POSTGRES_PASSWORD}@postgres:5432/ai_privacy_shield
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - uploads_vol:/app/uploads
      - outputs_vol:/app/outputs
    depends_on: [api]
    networks: [aps_net]

  # ── Celery Beat (periodic tasks) ─────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: aps_beat
    restart: unless-stopped
    command: celery -A app.worker beat --loglevel=info
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on: [worker]
    networks: [aps_net]

  # ── Flower — Celery Monitoring UI ────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: aps_flower
    restart: unless-stopped
    command: celery -A app.worker flower --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on: [worker]
    networks: [aps_net]

  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aps_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aps_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ai_privacy_shield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aps_user -d ai_privacy_shield"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aps_net]

  # ── MongoDB ───────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: aps_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ai_privacy_shield
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aps_net]

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: aps_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [aps_net]

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  mongo_data:
  redis_data:
  uploads_vol:
  outputs_vol:
  logs_vol:

# ── Network ───────────────────────────────────────────────────────────────
networks:
  aps_net:
    driver: bridge
